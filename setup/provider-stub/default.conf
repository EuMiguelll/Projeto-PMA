# Stub do PTAX do BACEN para o E2E do CI (docker compose --profile e2e): o teste fica
# determinístico e não depende de rede externa. O PTAX real é público e sem API key.
# O exchange pede CotacaoMoedaPeriodo(...)?@m='USD'&...; moeda sem cotação -> "value": [] -> 404
server {
    listen 80;
    default_type application/json;

    location / {
        if ($args ~ "@m='USD'") {
            return 200 '{"@odata.context":"stub","value":[{"cotacaoCompra":5.6666,"cotacaoVenda":5.668,"dataHoraCotacao":"2026-11-13 13:09:27.123"}]}';
        }
        if ($args ~ "@m='EUR'") {
            return 200 '{"@odata.context":"stub","value":[{"cotacaoCompra":6.581,"cotacaoVenda":6.589,"dataHoraCotacao":"2026-11-13 13:09:27.123"}]}';
        }
        return 200 '{"@odata.context":"stub","value":[]}';
    }
}
