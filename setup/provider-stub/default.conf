# Stub da PTAX do BACEN para o E2E do CI (docker compose --profile e2e): o teste fica
# determinístico e não depende de rede externa. A PTAX real é pública e sem API key.
# Responde às mesmas URLs OData que o exchange-py chama:
#   /CotacaoMoedaPeriodo(...)?@moeda='USD'&@dataInicial=...  -> boletins em BRL ("value": [] = moeda desconhecida -> 404)
#   /Moedas?$format=json&...                                 -> lista de moedas (GET /exchange/currencies)
# (o exchange-service Java, versão anterior, usava @m='USD': o regex aceita os dois)
server {
    listen 80;
    default_type application/json;

    location ~ /Moedas$ {
        return 200 '{"@odata.context":"stub","value":[{"simbolo":"EUR","nomeFormatado":"Euro"},{"simbolo":"USD","nomeFormatado":"Dólar dos Estados Unidos"}]}';
    }

    location / {
        if ($args ~ "@m(oeda)?='USD'") {
            return 200 '{"@odata.context":"stub","value":[{"cotacaoCompra":5.6666,"cotacaoVenda":5.668,"dataHoraCotacao":"2026-11-13 13:09:27.123"}]}';
        }
        if ($args ~ "@m(oeda)?='EUR'") {
            return 200 '{"@odata.context":"stub","value":[{"cotacaoCompra":6.581,"cotacaoVenda":6.589,"dataHoraCotacao":"2026-11-13 13:09:27.123"}]}';
        }
        return 200 '{"@odata.context":"stub","value":[]}';
    }
}
