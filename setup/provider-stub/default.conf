# Stub da AwesomeAPI para o E2E do CI (docker compose --profile e2e).
# Os runners do GitHub recebem 429 da AwesomeAPI sem API key; com o stub o teste
# fica determinístico e não depende de quota de terceiros. O provedor real é
# validado no EKS (smoke test 14/14 pelo ELB, com a key no Secret exchange-secrets).
server {
    listen 80;
    default_type application/json;

    location = /json/last/USD-BRL {
        return 200 '{"USDBRL":{"code":"USD","codein":"BRL","bid":"5.6666","ask":"5.668","create_date":"2026-11-13 18:30:13"}}';
    }
    location = /json/last/EUR-BRL {
        return 200 '{"EURBRL":{"code":"EUR","codein":"BRL","bid":"6.5810","ask":"6.5890","create_date":"2026-11-13 18:30:13"}}';
    }
    # par inexistente: a AwesomeAPI devolve 404 CoinNotExists -> o exchange responde 404
    location / {
        return 404 '{"status":404,"code":"CoinNotExists","message":"moeda nao encontrada"}';
    }
}
