apiVersion: v1
kind: ConfigMap
metadata:
  name: exchange-configmap
data:
  # PTAX do Banco Central: pública e sem API key (a disciplina a indica porque responde a IPs da AWS)
  PTAX_URL: https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata
  PTAX_TIMEOUT: "3"
  CACHE_SECONDS: "300"
  RETRY_SECONDS: "30"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exchange
  labels:
    app: exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exchange
  template:
    metadata:
      labels:
        app: exchange
    spec:
      enableServiceLinks: false # mesmo padrão dos outros serviços: sem variáveis *_PORT injetadas
      securityContext:
        runAsNonRoot: true # a imagem já roda como UID 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exchange
          image: DOCKERHUB_USER/exchange-py:latest
          imagePullPolicy: IfNotPresent # CI faz deploy com tag imutável :<sha>
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: exchange-configmap
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # o serviço não escreve em disco (cache em memória)
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 30 # o uvicorn sobe em ~1 s; folga para nós lentos
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe: # não depende da PTAX: com o BCB fora o pod segue servindo o cache (stale) ou 502
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: exchange
  labels:
    app: exchange
spec:
  type: ClusterIP # só o gateway chega nele (EXCHANGE_URI=http://exchange:8000)
  selector:
    app: exchange
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: exchange
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: exchange
  minReplicas: 1
  maxReplicas: 3 # cada réplica tem o seu cache: no pior caso, 3 chamadas à PTAX por moeda a cada 5 min
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
