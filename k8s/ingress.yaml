# OPCIONAL: Ingress com ALB. Requer o AWS Load Balancer Controller instalado
# (ver AWS_RUNBOOK.md, seção "Ingress com ALB"). Sem ele, use o Service
# LoadBalancer do gateway (padrão) e não aplique este arquivo.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health-check
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
