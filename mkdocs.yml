site_name: Plataformas 2026.2 — Projeto Store
site_description: Projeto final de Plataformas (Insper) — microsserviços Spring Boot no EKS
site_author: Enzo Canavero e Miguel Damasio
site_url: https://eumiguelll.github.io/Projeto-PMA/
repo_url: https://github.com/EuMiguelll/Projeto-PMA
repo_name: EuMiguelll/Projeto-PMA
edit_uri: ""

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      toggle:
        icon: material/toggle-switch-off-outline
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      toggle:
        icon: material/toggle-switch
        name: Modo claro
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.instant
    - navigation.top
    - navigation.path
    - navigation.tracking
    - navigation.expand

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: pt

nav:
  - Home: index.md
  - Projeto:
      - Visão geral e arquitetura: projeto/index.md
      - Gateway: projeto/gateway.md
      - Auth: projeto/auth.md
      - Account: projeto/account.md
      - Exchange: projeto/exchange.md
      - Bottlenecks: projeto/bottlenecks.md
      - Execução local: projeto/local.md
      - AWS e EKS: projeto/eks.md
      - AWS Runbook: projeto/runbook.md
      - CI/CD: projeto/cicd.md
      - Teste de carga: projeto/load-testing.md
      - Custos, PaaS e SLA: projeto/custos.md
      - Apresentação e vídeo: projeto/apresentacao.md
  - Atividades (roteiros): atividades.md
  - Uso de IA: uso-de-ia.md
